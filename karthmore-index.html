<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karthmore</title>
<meta name="description" content="Arcanepunk fantasy. A city of guilds, glass, and doors that open onto other worlds. The series, the worlds, the peoples, and new dispatches.">
<meta name="theme-color" content="#15172a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&display=swap" rel="stylesheet">
<style>
/* ------------------------------------------------------------------
   Tokens. These are the default (Dornalis) colors. Each world re-themes
   the page from its "color" in the content block, so you rarely need to
   touch this.
------------------------------------------------------------------- */
:root{
  --display:"Marcellus","Trajan Pro","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --body:"Newsreader",Charter,"Iowan Old Style",Georgia,serif;
  --ink:#15172a; --ink-2:#1d2040; --ink-3:#2a2e55;
  --bone:#ece5d4; --bone-dim:#b9b3a5;
  --accent:#10b981;      /* Emerald green */
  --accent-2:#b7b1e8;    /* Nyxara lilac */
  --bi-pink:#D60270;
  --bi-purple:#9B4F96;
  --bi-blue:#0038A8;
  --line:rgba(236,229,212,.18);
  --wrap:1120px;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--bone);font:400 1.125rem/1.7 var(--body);transition:background-color .6s ease}
img{max-width:100%;height:auto}
a{color:var(--accent);text-underline-offset:.2em}
a:hover{color:var(--bone)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent-2);outline-offset:3px}
main:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:1rem;top:-5rem;z-index:60;padding:.6rem 1rem;background:var(--accent);color:var(--ink);border-radius:4px}
.skip:focus{top:1rem}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 clamp(1.25rem,4vw,2.5rem)}

h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.15}
h2{font-size:clamp(1.8rem,3.6vw,2.7rem);margin-bottom:1rem}
p{margin:0 0 1.1em}
.prose p{max-width:66ch}
.lede{font-size:1.3rem;line-height:1.5;max-width:44rem}
.muted{color:var(--bone-dim)}

/* ---- Header ---- */
.site-head{background:rgba(21,23,42,.9);background:color-mix(in srgb,var(--ink) 90%,transparent);border-bottom:1px solid var(--line);z-index:30;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
@media(min-width:760px){.site-head{position:sticky;top:0}}
.head-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.4rem 2rem;padding-block:.85rem}
.brand{display:flex;align-items:center;gap:.7rem;font-family:var(--display);font-size:1.35rem;letter-spacing:.03em;color:var(--bone);text-decoration:none;position:relative}
.brand svg{width:32px;height:20px;flex:none}
.brand::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--bi-pink),var(--bi-purple),var(--bi-blue));opacity:.9}
.site-nav ul{display:flex;flex-wrap:wrap;gap:.1rem 1.6rem;list-style:none;margin:0;padding:0}
.site-nav a{display:inline-block;padding:.3rem 0;color:var(--bone-dim);text-decoration:none;font-size:1.02rem;border-bottom:2px solid transparent;transition:color .2s ease,border-color .3s ease}
.site-nav a:hover{color:var(--bone)}
.site-nav a[aria-current="page"]{color:var(--bone);border-bottom-color:var(--accent)}

/* ---- Buttons ---- */
.btn{display:inline-block;padding:.75rem 1.5rem;border-radius:4px;border:1.5px solid var(--accent);background:var(--accent);color:#15172a;font-family:var(--display);font-size:1.05rem;letter-spacing:.02em;text-decoration:none;transition:background-color .2s ease,color .2s ease}
.btn:hover{background:transparent;color:var(--accent)}
.btn.ghost{background:transparent;color:var(--bone);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--bone);color:var(--bone)}
.actions{display:flex;flex-wrap:wrap;gap:.9rem;margin-top:2rem}

/* ---- Hero: the skyline and the two moons are the one loud thing ---- */
.hero{position:relative;overflow:hidden;min-height:min(90vh,880px);display:flex;align-items:flex-start;
  background:linear-gradient(180deg,#0b0d1e 0%,#171a3a 40%,#33294f 72%,#5b4256 100%)}
.hero .glow{position:absolute;inset:auto 0 0 0;height:65%;background:radial-gradient(60% 70% at 50% 100%,rgba(240,192,120,.24),transparent 70%)}
.hero svg.skyline{position:absolute;left:0;bottom:-1px;width:100%;height:62%}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:90px;background:linear-gradient(to top,#15172a,transparent)}
.hero-copy{position:relative;z-index:2;width:100%;padding-top:clamp(3rem,13vh,8rem);padding-bottom:6rem}
.hero h1{font-size:clamp(3.6rem,12vw,9.5rem);line-height:.95;letter-spacing:.01em;text-shadow:0 2px 30px rgba(10,10,30,.6)}
.hero .say{margin:.9rem 0 0;font-style:italic;color:var(--accent);font-size:1.15rem}
.hero .lede{margin-top:1.4rem;color:var(--bone);text-shadow:0 1px 14px rgba(10,10,30,.8)}
.moon{position:absolute;border-radius:50%;animation:rise 2.6s cubic-bezier(.2,.7,.2,1) both}
.nyx{width:clamp(84px,13vw,180px);aspect-ratio:1;top:9%;right:clamp(6%,12vw,16%);
  background:
   radial-gradient(circle at 62% 64%,rgba(90,84,150,.55) 0 9%,transparent 10%),
   radial-gradient(circle at 34% 70%,rgba(90,84,150,.4) 0 6%,transparent 7%),
   radial-gradient(circle at 70% 30%,rgba(90,84,150,.35) 0 5%,transparent 6%),
   radial-gradient(circle at 36% 30%,#f4f0ff 0,#c4beee 50%,#8a84c4 100%);
  box-shadow:0 0 70px 14px rgba(183,177,232,.28)}
.sol{width:clamp(48px,7vw,96px);aspect-ratio:1;top:27%;right:clamp(22%,30vw,34%);animation-delay:.35s;
  background:radial-gradient(circle at 36% 30%,#fff3d6 0,#f3c882 55%,#cf9350 100%);
  box-shadow:0 0 60px 12px rgba(240,192,120,.3)}
@keyframes rise{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:640px){
  .hero-copy{padding-top:9rem}
  .nyx{top:2.2rem;right:12%}
  .sol{top:3.6rem;right:38%}
}

/* ---- Sections ---- */
.section{padding-block:clamp(3.5rem,8vw,6rem)}
.section + .section{border-top:1px solid var(--line)}
.split{display:grid;gap:1.5rem clamp(2rem,6vw,5rem);grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
@media(max-width:800px){.split{grid-template-columns:1fr}}
.page-head{padding-block:clamp(3rem,7vw,5rem) 1.5rem}
.page-head h1{font-size:clamp(2.5rem,6vw,4.2rem)}
.page-head .lede{margin-top:1rem}
.page-body{padding-bottom:clamp(3rem,7vw,5rem)}
.back{display:inline-block;margin-bottom:1.25rem;color:var(--bone-dim)}

/* ---- Doors: one per plane, moon count shown as pips in the arch ---- */
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:clamp(1rem,3vw,2.25rem);margin:2.5rem 0 0;padding:0;list-style:none}
@media(max-width:760px){.doors{grid-template-columns:1fr;max-width:22rem}}
.door{--a:#10b981;--bg1:#0f2a22;--bg2:#1a3d32;
  position:relative;display:flex;flex-direction:column;height:100%;min-height:420px;padding:2rem 1.5rem 1.7rem;
  color:var(--bone);text-decoration:none;text-align:center;
  border:1.5px solid var(--a);border-radius:999px 999px 8px 8px;
  background:radial-gradient(70% 45% at 50% 100%,color-mix(in srgb,var(--a) 34%,transparent),transparent 70%),linear-gradient(180deg,var(--bg1),var(--bg2));
  transition:box-shadow .3s ease}
.door::before{content:"";position:absolute;inset:10px;border:1px solid color-mix(in srgb,var(--a) 45%,transparent);border-radius:999px 999px 4px 4px;pointer-events:none}
.door:hover{color:var(--bone);box-shadow:0 0 44px -6px var(--a)}
.door .pips{display:flex;justify-content:center;gap:.65rem;margin-bottom:auto;padding-top:3.4rem}
.door .pips i{display:block;width:13px;height:13px;border-radius:50%;background:var(--a);box-shadow:0 0 14px 2px color-mix(in srgb,var(--a) 60%,transparent)}
.door h3{font-size:1.7rem;margin:1.5rem 0 .1rem}
.door .city{font-style:italic;color:var(--a);margin:0 0 .15rem}
.door .count{font-size:.95rem;color:var(--bone-dim);margin:0 0 .8rem}
.door .line{font-size:1rem;line-height:1.5;margin:0}

/* ---- Series ---- */
.series-item{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:1rem clamp(2rem,6vw,5rem);padding-block:2.5rem;border-top:1px solid var(--line)}
@media(max-width:800px){.series-item{grid-template-columns:1fr}}
.series-item h2{margin:0}
.series-item .kind{margin:.3rem 0 0;font-style:italic;color:var(--accent)}
.status{display:inline-block;margin-top:.9rem;padding:.1rem .8rem;border:1px solid var(--line);border-radius:999px;font-size:.95rem;color:var(--bone-dim)}
.series-item img{display:block;margin-bottom:1.25rem;max-width:220px;border-radius:3px}

/* ---- Cast ---- */
.cast{margin:1.5rem 0 0;padding:0;list-style:none}
.cast li{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:.4rem 3rem;padding:1.5rem 0;border-top:1px solid var(--line)}
@media(max-width:700px){.cast li{grid-template-columns:1fr}}
.cast .who{font-family:var(--display);font-size:1.5rem;line-height:1.2}
.cast .kind{display:block;margin-top:.3rem;font-family:var(--body);font-style:italic;font-size:1rem;color:var(--accent)}
.cast p{margin:0;max-width:60ch}
.cast p + p{margin-top:.8em}

/* ---- Worlds ---- */
.search{display:block;width:100%;max-width:34rem;margin-top:1.75rem;padding:.8rem 1rem;font:inherit;color:var(--bone);background:var(--ink-2);border:1px solid var(--line);border-radius:6px}
.search::placeholder{color:var(--bone-dim)}
.results{list-style:none;margin:1rem 0 0;padding:0;max-width:46rem}
.results li{padding:.9rem 0;border-top:1px solid var(--line)}
.results a{font-family:var(--display);font-size:1.2rem;text-decoration:none}
.results .where{margin-left:.6rem;font-style:italic;font-size:.95rem;color:var(--bone-dim)}
.results p{margin:.2rem 0 0;font-size:1rem;color:var(--bone-dim)}
.ref-link{display:block;margin-top:3rem;padding-top:2rem;border-top:1px solid var(--line)}

/* ---- Ships: a second city inside the same world, reached without a door ---- */
.ships{display:grid;grid-template-columns:1fr;gap:1.25rem;margin:1.5rem 0 0;padding:0;list-style:none;max-width:46rem}
.ship-card{display:block;padding:1.5rem 1.4rem;color:var(--bone);text-decoration:none;border:1px solid var(--a);border-radius:4px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--a) 16%,var(--ink-2)),var(--ink-2));transition:box-shadow .25s ease,transform .25s ease}
.ship-card:hover{color:var(--bone);box-shadow:0 0 30px -8px var(--a);transform:translateY(-2px)}
.ship-card h3{font-size:1.4rem;color:var(--a)}
.ship-card .ruler{margin:.3rem 0 0;font-style:italic;color:var(--bone-dim)}
.ship-card .line{margin:.6rem 0 0;font-size:1rem}
.ship-card .travel{margin:.6rem 0 0;font-size:.9rem;font-style:italic;color:var(--bone-dim)}
.city-head .ruler{margin:.6rem 0 0;font-style:italic;color:var(--accent);font-size:1.15rem}
.plane-facts{margin:1.25rem 0 0;color:var(--bone-dim)}
.index{display:flex;flex-wrap:wrap;gap:.35rem 1.4rem;margin:.5rem 0 0;padding:0;list-style:none}
.index-groups{margin:1.5rem 0 0;display:flex;flex-direction:column;gap:.4rem;max-width:46rem}
.index-groups details{border:1px solid var(--line);border-radius:4px;padding:.1rem 1rem .4rem;background:color-mix(in srgb,var(--ink-2) 50%,transparent)}
.index-groups summary{cursor:pointer;font-family:var(--display);font-size:1.1rem;letter-spacing:.03em;color:var(--accent);padding:.5rem 0;list-style:none}
.index-groups summary::-webkit-details-marker{display:none}
.index-groups summary::before{content:"+  ";opacity:.65}
.index-groups details[open] summary::before{content:"−  "}
.index-groups summary:hover{color:var(--bone)}
.index-groups .index a{font-size:1.02rem}
.index-groups .index{padding-bottom:.25rem}
.cat{font-size:1.3rem;color:var(--accent);margin:3rem 0 .25rem}
.entry{max-width:70ch;padding:1.75rem 0 .5rem;border-top:1px solid var(--line);scroll-margin-top:5rem}
.entry h3{font-size:1.55rem;margin-bottom:.5rem}
.entry .say{margin-left:.7rem;font-family:var(--body);font-style:italic;font-size:1rem;color:var(--accent)}
.entry ul{margin:0 0 1.1em;padding-left:1.2rem}
.entry.flash{animation:flash 2.4s ease-out}
@keyframes flash{from{background:color-mix(in srgb,var(--accent) 22%,transparent)}to{background:transparent}}

.table-wrap{overflow-x:auto;margin-top:1.5rem}
.cal{width:100%;min-width:640px;border-collapse:collapse}
.cal th,.cal td{padding:.9rem 1rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.cal thead th{font-family:var(--display);font-weight:400;font-size:1.3rem;border-bottom:2px solid var(--pc)}
.cal tbody th{width:10rem;font-weight:400;font-style:italic;color:var(--bone-dim)}
.say-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:2rem;margin:1.5rem 0 0;padding:0;list-style:none}
.say-list li{padding-top:1rem;border-top:1px solid var(--line)}
.say-list .name{display:block;font-family:var(--display);font-size:2rem;line-height:1.2}
.say-list .how{display:block;margin-top:.2rem;font-style:italic;font-size:1.2rem;color:var(--accent)}

/* ---- Registry: reads as a notice posted by the city ---- */
.notice{display:flex;align-items:center;gap:clamp(1rem,3vw,2rem);padding:clamp(1.25rem,3vw,2rem);border:1px solid var(--accent);box-shadow:inset 0 0 0 6px var(--ink),inset 0 0 0 7px var(--line)}
.notice .seal{flex:none;width:clamp(64px,10vw,96px);height:auto}
.notice .issuer{margin:0 0 .3rem;font-style:italic;color:var(--accent)}
.notice h1{font-size:clamp(2rem,5vw,3.2rem)}
.notice .filed{margin:.6rem 0 0;color:var(--bone-dim)}
.notice-intro{margin-top:2rem}
@media(max-width:560px){.notice{flex-direction:column;align-items:flex-start}}
.cast .status-line{margin:0 0 .6rem}
.cast .status{margin-top:0}
.census tbody th{width:auto;font-style:normal;color:var(--bone)}
.census-note{margin-top:.75rem;font-size:.95rem}
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.5rem;margin:1.5rem 0 0}
.tier{padding:1.5rem;border:1px solid var(--line);border-radius:4px}
.tier h3{font-size:1.3rem;color:var(--accent)}
.tier-peoples{margin:.5rem 0;font-style:italic;color:var(--bone-dim)}
.fg-head{margin-top:3.5rem;padding-top:2rem;border-top:1px solid var(--line)}
.fg-head h2{margin-bottom:.2rem}
.fg-head .byline{font-style:italic;color:var(--bone-dim)}
.realm{margin:2.25rem 0 0;font-size:1.3rem}
.sealed{margin-top:4rem;padding-top:2rem;border-top:1px solid var(--line)}
.sealed h2{font-size:1.8rem}

/* ---- Dispatches ---- */
.post-list{list-style:none;margin:1.5rem 0 0;padding:0}
.post-list li{max-width:46rem;padding:1.75rem 0;border-top:1px solid var(--line)}
.post-list h2,.post-list h3{font-size:1.7rem;margin:.15rem 0 .5rem}
.post-list h2 a,.post-list h3 a{color:var(--bone);text-decoration:none}
.post-list h2 a:hover,.post-list h3 a:hover{color:var(--accent)}
.post-list p{margin:0}
time,.meta{font-style:italic;font-size:1rem;color:var(--bone-dim)}
.post-body{margin-top:2rem}

/* ---- Page transitions and the door opening ---- */
main{transition:opacity .16s ease}
main.leaving{opacity:0}
main.entering .page-head,main.entering .page-body,main.entering .section{animation:pageIn .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 80ms)}
main.entering .hero{animation:heroIn .9s ease both}
@keyframes pageIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes heroIn{from{opacity:0}to{opacity:1}}
.door.opening{box-shadow:0 0 70px 6px var(--a)}
.door.opening .pips i{transform:scale(1.7);transition:transform .5s ease}
.portal{position:fixed;inset:0;z-index:100;
  background:radial-gradient(45% 55% at 50% 55%,color-mix(in srgb,var(--a) 75%,#fff 12%) 0,color-mix(in srgb,var(--a) 28%,transparent) 55%,transparent 85%),linear-gradient(180deg,var(--bg1),var(--bg2))}

/* ---- Footer ---- */
.site-foot{border-top:1px solid var(--line);padding-block:2.5rem;font-size:1rem;color:var(--bone-dim)}
.site-foot ul{display:flex;flex-wrap:wrap;gap:.3rem 1.5rem;list-style:none;margin:.75rem 0 0;padding:0}
.site-foot p{margin:0}
.site-foot .build{margin-top:.75rem;font-size:.85rem;opacity:.7}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

</header>
<main id="main" tabindex="-1"></main>
<footer class="site-foot"><div class="wrap" id="foot"></div></footer>

  // OTHER PLACES WITHIN A WORLD, NOT REACHED BY DOOR: a plane can hold more
  // than one of these. Each gets its own full page and its own color, but
  // sits inside its parent plane rather than getting a separate door of its
  // own. "travel" is the short line shown on its card — how you actually get
  // there (by ship, overland, whatever fits). To add one, copy an entry,
  // change "plane" to the world it belongs to, and write "sections": each

  cities: [
    {
      key: "ashenmoor", plane: "dornalis", name: "Ashenmoor",
      tagline: "The vampire continent, once part of the same supercontinent as Korrathis.",
      travel: "Five days by ship, across the strait the Sundering left behind.",
      ruler: "King Malakor Drake",
      color: "#9a3b5c",
      sections: [
        { h: "Geography and infrastructure", text: [
          "The Midnight Expanse is a sprawling lowland that physically mirrors the night sky. The Sundered Spine, a towering central mountain range, splits the continent into west and east, crossed by the heavily fortified Shadow Gate Pass. Dense timberland runs the western coast, wraps the central mountain crescent, lines the southern shore, and holds the eastern block.",
          "Three cities anchor the southeast: Highspire, the primary cultural and guild capital; Ravencrest, the interior crossroads hub; and Tidefall, an island metropolis across the channel. Gloomforge is the northwestern industrial mining city, built high near the northern ridges to extract raw metals and minerals. Anchor's Rest is a massive coastal village on the northeastern peninsula and the continent's premier maritime shipping hub.",
          "Wayland Anchors are specialized transit stations housing metal-framed doors near the major trade roads and the Shadow Gate Pass, built for rapid cross-continent travel. Coastal shipping handles bulk cargo, and overland trade routes connect Gloomforge, the Shadow Gate Pass, the Wayland Anchors, and the southeastern metropolis network across the channel."
        ] },
        { h: "Sky and weather", text: [
          "Natural overcast skies diffuse daylight into a comfortable, perpetual twilight. Rolling rainstorms sweep the land on a regular schedule, and inhabitants follow strict routines to collect, store, and redistribute that rainwater into urban cisterns and agricultural fields.",
          "Ashenmoor keeps the same 24-hour day and night cycle as Karthmore. On a full moon, Lycans and were-creatures shift involuntarily; cities keep locked gates open for those who choose the wilderness, alongside fortified sanctuary buildings inside the walls for residents who'd rather stay. A nighttime eclipse instantly cancels all transformations and suppresses shifting entirely. A daytime solar eclipse does the opposite: it allows easier, voluntary transformation while the mind stays in full control."
        ] },
        { h: "Feeding and food", text: [
          "Most vampires rely on consensual feeding contracts with willing human and mortal residents, a practice the culture treats as a respected, mutually beneficial partnership, usually supported through stipends or privileges. Feeding on livestock is strictly taboo and heavily discouraged, since it drains the continent's food infrastructure directly.",
          "Rain-fed agricultural belts and ranches carry the caloric load instead, sized to feed Lycans and were-creatures alongside the broader mortal population."
        ] },
        { h: "History, magic, and government", text: [
          "Ashenmoor once shared a single supercontinent with Karthmore, before the Sundering split them apart. Left to itself, Ashenmoor prioritized local infrastructure, civil engineering, and agricultural technology over expansion. It adopted Rune Doors only during the war with Alathia, and that war was what led to its discovery of planar magic at all.",
          "Vampires and Shifters trace their power to ancestors cursed by the Old Gods. Over generations those curses softened into abilities the culture now manages and celebrates rather than fears. Migrations of humans and witches after the war brought vital aid and permanently expanded the population.",
          "Government runs in three tiers. The King, currently Malakor Drake, holds supreme authority over continental law, international relations, and defense. The Potentates are lineage and religious leaders who manage spiritual doctrine and sacred policy. The Governors are civic administrators who run individual cities, rain-siphon schedules, and public works."
        ] },
        { h: "Karthmore and the Rebellion", text: [
          "Ashenmoor is a firm, official ally of Karthmore, and actively extradites Rebel fugitives who enter through the Wayland Anchors back to Karthmore as prisoners of war. Underneath that alliance, a portion of the civilian population secretly sympathizes with the Rebellion's cause, whatever their government's position."
        ] },
        { h: "What makes it different", text: [
          "Ashenmoor prioritizes internal stability, infrastructure, and the wellbeing of its own people over reach across the multiverse. It is a land of symbiotic pragmatism, where ancient divine curses became honored legacies, and where disparate races built a self-sustaining home together rather than an empire."
        ] }
      ]
    },
    {
      key: "tirna-gael", plane: "dornalis", name: "Tirna-Gael",
      tagline: "A second continent on Korrathis's own plane, low on Aether and closer to Earth than to Karthmore.",
      travel: "By ship only. Its rune doors carry trade with other realms, never travelers.",
      color: "#4f8a6d",
      sections: [
        { h: "Overview & Geography", text: [
          "Tirna-Gael is a low-Aether material plane that shares the same physical plane as Korrathis. Its physics strongly mirror Earth, featuring a varied landscape of major continents, wild inland biomes, and island chains.",
          "At the center of the known world lies a primary central hub island, home to the permanent planar rune doors that connect Tirna-Gael to other realms. The central hub functions as a bustling multi-race diplomatic and commercial port; the surrounding continents are divided into distinct racial homelands and regional cities."
        ] },
        { h: "Biomes & Architecture", text: [
          "Architecture across Tirna-Gael is heavily biome-specific, using locally sourced materials and structural aesthetics that reflect the physiology and culture of each native race.",
          "Selkies raise underwater and amphibious architecture along coastal reefs and ocean trenches — organic curves, bioluminescent accents, polished coral stone, soft blues, greens, and whites. Banshees build high-altitude, wind-resistant stone shelters and rope-anchored structures into mountain peaks, using cold grays, tans, and natural slate. Centaurs favor mobile, modular tent structures, wind-breaks, and heavy wooden platforms designed for rapid assembly and breakdown during seasonal migrations. Dryads and Nymphs grow living-wood architecture, woven canopy dwellings, and terraced stone waterways integrated directly into natural flora.",
          "Members of these same peoples also live and work in Karthmore. The Registry and Field Guide record them there; Tirna-Gael remains the place where their architecture and daily rhythms are native rather than adapted."
        ] },
        { h: "Sensory Details & Atmosphere", text: [
          "Because Tirna-Gael sits on the same material plane as Korrathis, its physical laws strongly mimic Earth, though with a distinctly low ambient Aether level.",
          "The air is crisp, dense, and clean, carrying sharp natural scents — salty ocean sprays, damp soil, pine resin, and dry sun-baked grass — without the heavy industrial haze of Korrathis. Daylight is bright and unfiltered, casting sharp shadows across open plains and dappled light through forest canopies. Nights are clear and star-lit.",
          "Sound is acoustic and physical: the creak of wooden docks, the rustle of glider canvas, the rhythmic thud of hooves on dirt, and wind cutting through mountain passes. Low Aether leaves the world feeling quiet and physically grounded. Magic does not linger or warp the landscape, forcing reliance on natural effort, physical crafting, and weathercraft."
        ] },
        { h: "Urbanization & Regional Cities", text: [
          "While the central hub island handles international planar trade, permanent cities and regional trade posts dot the main continents. Urbanization exists in balance with the surrounding environments.",
          "Working industries include blacksmiths, textile weavers, timber yards, and glassworks that support shipbuilding, glider construction, and regional commerce. Production relies on wind power, natural waterwheels, and high-ventilation stonework rather than mass coal-burning mills or runic shielding. Well-maintained stone roads, river networks, and coastal shipping routes connect inland settlements to coastal ports."
        ] },
        { h: "Governance, Law & Political Alignment", text: [
          "Political alignment across Tirna-Gael is fragmented into three primary models across its racial homelands.",
          "The Annexed Nations are imperial-controlled key coastal regions and trade arteries, governed by imperial tax collectors, garrisons, and strict regulations. The Allied Nations are sovereign territories maintaining formal trade treaties and diplomatic alliances with the Empire, leveraging vital exports to preserve their independence. The Independent Nations are untamed biomes — Banshee crags, Dryad groves, Centaur steppes — that recognize no imperial authority and actively push back against foreign presence. The Central Hub sits as neutral diplomatic ground, governed by a coalition of regional delegates."
        ] },
        { h: "Culture, Daily Life & Customs", text: [
          "Daily rhythms are determined by location and environment. In the racial homelands, Centaurs and Banshees center their days around breaking camp, inspecting herds, migrating, scouting, and holding tribal councils. Selkies spend mornings underwater harvesting kelp and reagents, then mid-days in land form trading along beaches and docks. Nymphs and Dryads align work cycles with daylight, focusing on river care, timber-shaping, and harvesting raw alchemical botanicals.",
          "Imperial city rhythms in annexed hubs follow rigid imperial clockwork — set market hours, uniform shift schedules, and nightfall curfew bells. Independent hub rhythms operate under agreed-upon civic treaties so multi-race timetables prevent overlap between nocturnal mountain dwellers, amphibious traders, and terrestrial merchants."
        ] },
        { h: "Magic & Technology", text: [
          "Low-Aether levels severely restrict speed-casting and traditional spells. Mages struggle with basic incantations, so society shifts focus away from pure arcana. Alchemy serves as the primary functional power of the plane: potion-making and reagent refinement account for 45% of urban jobs, while 30% of the working class operates as specialized farmers, gatherers, and hunters supplying the raw ingredients.",
          "The permanent planar doors in the central city remain the most powerful magical artifacts on the continent, preserved via alchemical stabilization and legacy enchanting for high-value trade. Cross-continent travel uses lightweight industrial gliders launched via high-tension ballista catapult systems. Major cities feature permanent launch towers and hangars; nomadic populations use horse-drawn mobile landing platforms to receive couriers and travelers along their migration routes."
        ] },
        { h: "Key Figures & Factions", text: [
          "In the annexed cities the Imperial Guild Houses operate as local branches of Korrathis guilds: the Alchemical Syndicate sets reagent quotas and pricing, the Courier Guild runs the launch towers and glider logistics, and the Imperial Tax Directorate handles tariffs and trade licensing.",
          "The High Council of the Central Hub is a diplomatic body composed of delegates from each race — Centaur clan speaker, Selkie dock-reeve, Dryad grove-keeper — managing local laws and planar door security. Continental Clan Leaders include Nomad High Chieftains who manage migration paths and wilderness law, and Coastal Merchant Princes who control deep-sea marine exports."
        ] },
        { h: "What makes it different", text: [
          "Tirna-Gael is the closest thing to Earth that the plane has to offer — low on magic, high on craft, and organized around what a person can actually build with their hands. Where Karthmore runs on Velo-Script and Ashenmoor on divine curses, Tirna-Gael runs on alchemy, gliders, and four very different peoples who mostly just want to be left alone on their own land."
        ] }
      ]
    },
    {
      key: "sovereign-reach", plane: "dornalis", name: "The Sovereign Reach",
      tagline: "The independent nation sharing Korrathis's own continent with the Imperium — the Four-Race Frontier.",
      travel: "Overland, across the shared continent. No door, no ship.",
      color: "#7a8f6b",
      sections: [
        { h: "Settlement & Geographic Layout", text: [
          "The Ridge of Cinders is a towering northern mountain range featuring sheer coastal cliffs along the sea. Peakhold Crag, a high-altitude Orc fortress in the northwest, monitors the northern waters. The High Bastion, an Orc stronghold in the northeast, guards the eastern mountain passes. Gloomforge Deep holds subterranean Gnomish workshop networks and iron towers embedded in the mountain core. The Pass-Gate Ramparts are Half-Orc foothill cities managing pass security and mountain-to-lowland trade.",
          "South of the mountains, the Lowland Valleys are fertile plains cultivated by widespread Halfling farming communities, centered on Oakhaven Market, the central Halfling agricultural and market hub. Port Anchors, on the southwest coast, handles sea trade and heavy shipping."
        ] },
        { h: "Governance & Regional Law", text: [
          "Each race governs its own territory: Gnomes through a Guild-Tech Oligarchy, Orcs through Clan Councils, Half-Orcs through a Martial Republic, and Halflings through Elder Assemblies. The Century Accord, a shared legal framework established a hundred years ago, enforces local jurisdiction based on territory. The Quad-Council, a joint diplomatic body of all four races, resolves inter-race disputes and coordinates defense."
        ] },
        { h: "Evolutionary History & Trade Protocols", text: [
          "The Reach's four races share common ancestors with the vampires, humans, shifters, and witches of Ashenmoor and Korrathis. Like them, they were touched by the Old Gods' curses — in their case granting inherent fire resistance and heightened cognitive creativity rather than the gifts the other lineages received. After the Sundering they migrated north, blaming human rune magic for the cataclysm.",
          "Trade with the Korrathis Imperium is strictly land-only. Trade with Ashenmoor is maintained through regulated Rune Doors."
        ] },
        { h: "Environment, Soundscapes & Pragmatism", text: [
          "The climate stratifies with altitude: lowlands feature temperate rainstorms; mid-slopes carry thick fog and light snow; high peaks endure heavy snow. With zero ambient Aether the world feels earth-like — natural wind, bees, and birdsong mixed with distant Gnomish forge hammers.",
          "The Reach holds strict neutrality toward both the Rebellion and the Imperium. Asylum or extradition for rebels is decided purely on regional benefit."
        ] },
        { h: "Native Abilities & Technology", text: [
          "Zero ambient Aether leaves all four races with zero innate magical aptitude. Inherited fire resistance and heightened cognitive functions drive rapid technological innovation: heavy industrial mechanics, steam power, complex gearwork, hydraulic lifts, blast furnaces, non-magical siege defenses, and automated watchtowers along the borders."
        ] },
        { h: "Architectural Lighting, Atmospheric Saturation & Sensory Detail", text: [
          "Gloomforge Deep is lit by thermal luminescent crystal conduits and amber furnace glares. The Pass-Gate Ramparts use heavy brass oil lanterns. Oakhaven runs on low peat fires and warm glass oil lamps.",
          "The air is dense and crisp, devoid of any Aether hum. Sub-zero mountain winds at high elevations contrast sharply with the intense geothermal warmth, wet soot, and hot iron scent inside the subterranean tunnels. At Peakhold Crag high winds and raptor calls overlay steam-piston pulses; in the lowland valleys the sound is mountain streams, clover-bees, and gentle rain on thatched roofs."
        ] },
        { h: "Cultural Traditions & Daily Life", text: [
          "The Four-Race Synergy is a practical trade loop: Halflings supply grain, vegetables, and meats while Gnomes and Orcs provide heavy machinery, masonry supports, and iron tools.",
          "The Forge-Kindling is an annual harvest-end festival where smiths handle white-hot iron with bare hands, using their innate fire resistance, alongside lowland banquets. The Grand Exchange is a seasonal trade fair at the Pass-Gate Ramparts for trade, labor contracts, and legal resolutions.",
          "Cuisine follows the altitude: spiced mountain goat and subterranean mushroom ale in the peaks; rich vegetable stews, smoked trout, and berry wine in the lowlands."
        ] },
        { h: "The Quad-Council", list: [
          "Arch-Engineer Vane (Gnome Delegate) — Overseer of Gloomforge Deep; manages furnace production, efficiency, and the Ashenmoor Rune Door link",
          "Warmaster Throk (Orc Delegate) — Commander of Peakhold Crag; maintains northern coastal watches and regional defense",
          "Warden-General Korra (Half-Orc Delegate) — Leader of Pass-Gate garrisons; oversees rebel asylum/extradition, trade routes, and border patrols",
          "Speaker Bramblewick (Halfling Delegate) — Head of Oakhaven Assemblies; coordinates grain supply, lowland economy, and internal trade"
        ] }
      ]
    }

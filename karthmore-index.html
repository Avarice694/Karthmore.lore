  lore: [
    // ---------------- Dornalis ----------------
    { id: "dornalis", plane: "dornalis", cat: "Lands", name: "Dornalis",
      text: ["Dornalis is a plane: a separate reality with its own universe, its own physics, its own moons, and its own calendar. It holds about ten landmasses. The books have charted only a few of them."] },
    { id: "korrathis", plane: "dornalis", cat: "Lands", name: "Korrathis",
      text: ["The empire's continent. The Korrathis Imperium rules from here, and an independent nation shares the landmass with it."] },
    { id: "karthmore", plane: "dornalis", cat: "Lands", name: "Karthmore", pron: "Car-th-more",
      text: [
        "An arcanepunk metropolis inside the Korrathis Imperium, and the setting of the series. Evelyn Reed works here, at the Glass-Binders Guild.",
        "Rebels reach the city through chalk doors. Its laws fill forty-five articles, and at least one character can quote them word for word."
      ] },
    { id: "ashenmoor", plane: "dornalis", cat: "Lands", name: "Ashenmoor",
      text: ["The vampire continent. It shares its origin with Korrathis: the Sundering once split a single supercontinent into the two lands."] },
    { id: "sundering", plane: "dornalis", cat: "Lands", name: "The Sundering",
      text: ["A prehistoric event that split a supercontinent into two: the continent of Korrathis and the continent of Ashenmoor."] },
    { id: "thessivane", plane: "dornalis", cat: "Lands", name: "Thessivane",
      text: [
        "Beautiful name, dangerous reality. Korrathis knows the continent exists and has neither explored nor conquered it.",
        "Dense forest fills the centre and reaches parts of the coast. Open plains and clearings break it up, hot springs lie in the northwest, and a single significant mountain range rises from the largely flat land."
      ] },
    { id: "far-lands", plane: "dornalis", cat: "Lands", name: "Beyond the charts",
      text: [
        "Kalûdesh is a desert continent of nomadic peoples.",
        "Oluven is an island chain. Each small island holds a single settlement, boats and bridges link them, and the large central island holds the capital.",
        "Ercanthis is a civilization as advanced as Korrathis, or more so. Its open grasslands hold only three cities: the City of Law, which rules; the City of Order, which handles commerce and work; and the City of Guilds, where guilds and gangs mingle in chaos.",
        "About four more landmasses have no name yet."
      ] },

    { id: "rebellion", plane: "dornalis", cat: "Powers and peoples", name: "The Rebellion",
      text: ["A movement that slips into Karthmore through chalk doors. Its ranks run commander, captain, soldier. Its public leader is Remus Wolfgar Mathews."] },
    { id: "named-powers", plane: "dornalis", cat: "Powers and peoples", name: "Other names to know",
      text: ["The Greek Olympian Syndicate. The Norse Aesir and Vanir. The Aztec Obsidian Cartel. The Order of the Hunt, a cult that hunts angels."] },
    { id: "witches", plane: "dornalis", cat: "Powers and peoples", name: "Witches and Warlocks",
      text: ["Two races with battle-mage and healer histories. Witches wear deep plum-purple robes stitched with silver sigils."] },

    { id: "velo-script", plane: "dornalis", cat: "Ideas", name: "Velo-Script doors",
      text: ["Magical doors between planes. They do not carry you across space. They move you from one reality into another. Alathia and Krag Doss Ner can be reached no other way."] },
    { id: "law", plane: "dornalis", cat: "Ideas", name: "Karthmore's law code",
      text: ["Forty-five articles, in formal legal-citation style, across six titles:"],
      list: ["Governance", "Guild Law", "Property", "Citizenship", "Commerce", "Criminal Law"] },
    { id: "dawns", plane: "dornalis", cat: "Ideas", name: "The Dawns",
      text: ["The universal dating system. It follows Korrathis's calendar by treaty."] },

    // ---------------- Karthmore's Districts ----------------
    { id: "d-crown-apex", plane: "dornalis", cat: "Districts", name: "The Crown Apex",
      text: ["The Noble Quarter. Old money, fortified and quiet — a place you are invited to, not one you visit."],
      detail: [
        "The Crown Apex is not a place you visit. It is a place you are invited to. Home to the oldest money and the most powerful names in the city, the Apex is defined by its silence — a quiet that costs more than most people earn in a lifetime.",
        "The district runs on a handful of Master Arteries, twelve to fifteen at most, each one a private link to House Sterling vaults or ancestral estates on Gold-Rich planes. You will not find public doors here. Every threshold has a dedicated squad of Threshold Wardens and Gargoyle guardians, and the Triple-Key locks exist specifically to ensure the wrong sort do not wander through.",
        "The crown jewel of the district belongs to Archon Valerius, whose Starlight Artery bathes the entire quarter in perpetual soft twilight — the only door in the city that never closes. Vampires, Nephilim, and Gargoyles hold the Apex; it runs on clean, high-vibration Velo-Script and sees very little street-level enforcement."
      ] },
    { id: "d-anvil-loom", plane: "dornalis", cat: "Districts", name: "The Anvil & Loom",
      text: ["The Working District — the city's muscle. Forges, looms, and the Sigil-Press that certifies every door plate in Karthmore."],
      detail: [
        "If the Apex is the city's money, the Anvil & Loom is its muscle. Forty to fifty Industrial Arteries run constantly here, moving tons of steel and drawing heat from volcanic planes to feed the forges and looms that keep the city clothed, armed, and functional.",
        "The most important address in the district is the Sigil-Press, where the official Subject and Verb plates for the city's doors are stamped and certified. Without this place, nothing opens.",
        "Foreman Throm runs the floor with an iron hand — literally. His master Wrench-Sigil can manually lock down any Artery in the district in an emergency, making him quietly one of the most powerful men in the city. Dwarves work here with Graft-Beards; Golems rest in Charging Racks when not active."
      ] },
    { id: "d-aether-wharf", plane: "dornalis", cat: "Districts", name: "The Aether-Wharf",
      text: ["The Docks. Few doors, enormous ones — Void-Haulers move forests and mountains of ore through on Void-Haulage's terms."],
      detail: [
        "Do not let the low door count fool you. The Wharf does not need many Arteries — it needs big ones. The widest Metal Arteries in existence run through here, wide enough for Void-Haulers to push entire forests or mountains of ore through in a single pass.",
        "The Void-Haulage Co. owns the cranes, the Anchor-Runes, and effectively the district itself. If something large needs to move into or out of the city, it moves through the Wharf, and it moves on Void-Haulage's terms.",
        "Orcs and Half-Orcs form its backbone. Kappa handle water purification, Selkies pilot from the submerged Wet-Docks, and Minotaurs move cargo through its high-ceilinged warehouses."
      ] },
    { id: "d-warrens", plane: "dornalis", cat: "Districts", name: "The Warrens",
      text: ["Residential labyrinth. Needle Gates, chalk doors overnight, Lyra's coffee shop, and a long tradition of looking the other way."],
      detail: [
        "The Warrens do not have streets so much as shortcuts. Thousands of Needle Gates thread through every basement, alley, and shop closet in the district, turning what should be a labyrinthine residential sprawl into something locals call the Planar Subway. A two-second Needle-Hop can skip you across the entire district through a neutral plane.",
        "Alongside the legal gates, illegal Chalk Doors bloom on walls overnight and vanish by morning. The Warrens have their own rhythm, their own rules, and a long tradition of looking the other way.",
        "Lyra's coffee shop sits here. Oni are a visible presence. The city's least documented residents live here too — the Changelings, whose numbers the Commission can only guess at, and the Cold Pockets, where failed cooling-runes left the temperature permanently wrong and the Wendigo-kin now live."
      ] },
    { id: "d-conduit", plane: "dornalis", cat: "Districts", name: "The Conduit",
      text: ["Power & utilities. Great Siphons draw mana from the Aetherial Plane; High-Voltage Nix does not take meetings."],
      detail: [
        "Unglamorous and essential. The Conduit runs on ten Great Siphons — massive Metal gates that serve not as doorways but as straws, drawing mana continuously from the Aetherial Plane to power the city above.",
        "High-Voltage Nix manages the Cooling Siphons, venting the excess heat from the city's power grid into a frozen Void Plane before it can cook the infrastructure from the inside out. She does not take meetings.",
        "Banshees operate the city's runic telegraph arrays from here — a pairing that suits everyone, since it keeps them and their vocal abilities well clear of residential areas. Jinn favor its heat."
      ] },
    { id: "d-scriptum", plane: "dornalis", cat: "Districts", name: "The Scriptum",
      text: ["The Archive District. Five doors, daily-shifting coordinates, and the Ink-Well's Marrow-Ink for maps that stay accurate."],
      detail: [
        "Five doors. That is all the Scriptum needs, and even those change coordinates daily as the Scribes map new Resource Veins across the planes. This is not a district for wandering — it is a district for knowing exactly where you are going and why.",
        "The Ink-Well supplies the specialized Marrow-Ink used for high-precision planar cartography. If you need a map drawn that actually stays accurate, this is where it starts.",
        "High Elves move through it like they own it — several do — alongside a Drow population and the Automata who staff its archive systems with perfect accuracy and no editorial opinion at all."
      ] },
    { id: "d-sanctuary", plane: "dornalis", cat: "Districts", name: "The Sanctuary",
      text: ["Healing & spirit. Filtering Siphons from the upper planes; Healer Hana's Marrow-Clinic extracts Aether-poisoning from blood."],
      detail: [
        "The Sanctuary pulls its air, its light, and its restorative mists directly from the upper planes through thirty Filtering Siphons, giving the district a quality of atmosphere found nowhere else in the city. Hospitals here do not just treat the body — they treat what the planes do to it.",
        "Healer Hana runs the Marrow-Clinic, where specialized Needle-Gates are used surgically to extract Aether-poisoning directly from a patient's blood. It is delicate, expensive, and the only place in the city that does it.",
        "Angels work its high guard and advise the Senate on planar matters. Dryads and Nymphs are bound to its Life-Arches in the hospitals. Homunculi assist in the clinics. Witches run clinics and small magical schools from here."
      ] },
    { id: "d-iron-ring", plane: "dornalis", cat: "Districts", name: "The Iron Ring",
      text: ["Security. Forty Tactical Arteries hard-wired to every district. Shield-Locked, cold, not interested in visitors."],
      detail: [
        "The Iron Ring does not advertise itself. It does not need to. Forty Tactical Arteries are hard-wired directly to every other district in the city, allowing Commander Vane to snap a squad from the Ring to the Docks in seconds flat.",
        "Every door here is Shield-Locked. Every threshold is a chokepoint. The Ring is efficient, cold, and not interested in visitors.",
        "Lycans staff its tracking units. Tengu work it as courier-scribes and martial arts instructors — fast, precise, and not particularly interested in conversation."
      ] },
    { id: "d-fringe", plane: "dornalis", cat: "Districts", name: "The Fringe",
      text: ["Nightlife. Unregulated Needle Gates, the Velvet Demon, and Sly-Tail's Coordinate Exchange — enforcement optional."],
      detail: [
        "The Fringe operates by different rules than the rest of the city — or rather, it operates by no rules at all. Hundreds of unregulated Needle Gates and Blood-Runic doors shift and change nightly, and the city's enforcement presence is either absent or on someone's payroll.",
        "The crown jewel is the Velvet Demon, a club whose dance floor is a live Needle Gate cycling dancers between three different planes, shifting gravity and lighting mid-song. For something more transactional, Sly-Tail runs the Coordinate Exchange — a black market shop where a one-time-use Chalk-Key to a secret plane can be yours, for the right price.",
        "Tanuki are almost professionally involved in trade that leaves no paper trail. Devils keep contract-arbitration offices here. Demons do the work Devils consider beneath them. Valravn gather in its high-perch rafters as assassins and spies."
      ] },
    { id: "d-gullet", plane: "dornalis", cat: "Districts", name: "The Gullet",
      text: ["Waste management. One-way Disposal Siphons. No Return Runes. Dusty Pete does not talk about what comes through."],
      detail: [
        "The Gullet is where things go to stop existing. Five one-way Disposal Siphons handle everything the city needs to quietly disappear — waste, byproduct, and anything else that needs to never come back. There are no Return Runes here. Once matter passes through, the Velo-Script Sentence ensures it cannot be Origin-Snapped back.",
        "\"Dusty\" Pete has managed the Gullet longer than anyone can remember. He does not talk much about what comes through."
      ] },
    { id: "d-nexus", plane: "dornalis", cat: "Districts", name: "The Nexus",
      text: ["The most diverse district in the city, alongside the Warrens — every recognized race keeps a recorded presence here. Humans, Halflings, Kitsune, and Centaurs all call it home; Kitsune data-brokers and entertainers are most often found on its streets."] },
    { id: "d-working", plane: "dornalis", cat: "Districts", name: "The Working District",
      text: ["Middle-class hub beyond the Anvil floor. Humans, Gnomes, Dwarves, and Golems do the precision work — mana-dye handling, accounting, Glass-Binder floors — the trades that keep everything else running."] },
    { id: "d-verdant", plane: "dornalis", cat: "Districts", name: "The Verdant",
      text: ["Farmland and the edge of the Soil-Stewards' world. Wood Elves work its planes almost exclusively; Satyrs and Fawns are often found here, on and off the clock, when the Threshers quiet down."] },
    { id: "d-under-city", plane: "dornalis", cat: "Districts", name: "The Under-City",
      text: ["Beneath the Fringe, where the architecture is less regulated and the smell of sulfur is considered ambient. Demons live here; the streets above prefer not to ask what the streets below are for."] },


    // ---------------- Guilds of Karthmore ----------------
    { id: "guilds-overview", plane: "dornalis", cat: "Guilds", name: "The Ten Guilds",
      text: [
        "Karthmore does not run on the Senate alone. Ten guilds hold the real machinery — doors, power, food, law at the threshold, and the gold behind the currency. Each holds four Senate seats. Forty in total. In theory that is balance."
      ],
      detail: [
        "Karthmore does not run on the Senate alone. Ten guilds hold the real machinery of the city: the frames of every Door, the math that aims them, the power in the walls, the carts on the streets, the cargo that would kill anyone else who touched it, the guards at every Iris, the planes that grow the grain, the glass in every phone, the clinics that pull poison from blood, and the miners who dig the gold that backs the currency.",
        "Each guild holds four seats in the Senate — forty in total. On paper that creates balance. In practice the Sigil-Welders and Lexicon Scribes often vote as a block on tech standards: one owns the frame, the other owns the math, and together they effectively own the Door. The Inter-Planar Mercantile and the Threshold Wardens live in a permanent cold war — speed against inspection — and neither side has won yet.",
        "What follows is a practical guide to who actually runs the city, and what they want from you."
      ] },
    { id: "guild-sigil-welders", plane: "dornalis", cat: "Guilds", name: "The Sigil-Welders",
      text: ["The Builders. Anvil District. Only guild licensed to construct and maintain the Arches every Door depends on."],
      detail: [
        "Based out of the Anvil District, the Sigil-Welders are the only guild licensed to construct and maintain the Arches — the metal frames that every Door in the city depends on. They do not write the coordinates. They do not move the goods. They do not flip the switch. They build the thing everything else runs on.",
        "If they ever decide to stop, the Doors drift, collapse, and take the city with them. They know it. Everyone knows it."
      ] },
    { id: "guild-lexicon-scribes", plane: "dornalis", cat: "Guilds", name: "The Lexicon Scribes",
      text: ["The Architects. The Scriptum is theirs. Patents on Velo-Script and every Tri-Sign coordinate that makes a Door useful."],
      detail: [
        "The Scriptum District belongs to the Scribes, and the Scribes belong to their math. They hold the patents on Velo-Script and calculate every Tri-Sign coordinate that points a Door somewhere useful. A metal arch without their work is just decoration.",
        "Their real power is not in what they build — it is in what they know. They know where every Door goes, and they decide whether you get to know too."
      ] },
    { id: "guild-aether-tappers", plane: "dornalis", cat: "Guilds", name: "The Aether-Tappers",
      text: ["The Power Grid. The Conduit is their domain. Lights, cable cars, and phones run on their goodwill."],
      detail: [
        "The Conduit is their domain, and the city's lights, cable cars, and phones run on their goodwill. The Tappers manage the Siphon Vents that pull energy from elemental planes and feed it into the city's grid.",
        "If the Senate votes against their interests, entire districts go dark. They have done it before. They will do it again."
      ] },
    { id: "guild-mercantile", plane: "dornalis", cat: "Guilds", name: "The Inter-Planar Mercantile",
      text: ["The Traders. Not one district — every place money changes hands. They set the price of bread and ore."],
      detail: [
        "The Mercantile does not operate out of a single district so much as it operates out of everywhere money changes hands. They own the carts, the logistics networks, and the relationships that move goods from the Arteries to the shelves.",
        "They set the price of bread. They set the price of ore. If you want to argue with them about it, you are welcome to grow your own."
      ] },
    { id: "guild-void-haulers", plane: "dornalis", cat: "Guilds", name: "The Void-Haulers",
      text: ["The Logisticians. Aether-Wharf. Hazardous and heavy matter does not cross a threshold without them."],
      detail: [
        "Nobody moves hazardous or heavy matter across a threshold without the Haulers. Based at the Aether-Wharf, they employ the strongest Orcs and Golems in the city and specialize in the kind of cargo that would kill anyone else trying to handle it.",
        "If the Haulers strike, raw resources pile up at the mouth of the Door and stay there until the city blinks first. The city always blinks first."
      ] },
    { id: "guild-threshold-wardens", plane: "dornalis", cat: "Guilds", name: "The Threshold Wardens",
      text: ["The Gatekeepers. Standing police at every major Iris. Answer to the Iron Ring. Quarantine is their quiet weapon."],
      detail: [
        "The only guild that doubles as a standing police force. The Wardens guard the Iris of every major Door in the city and answer to the Iron Ring.",
        "Their most powerful tool is not force — it is paperwork. They can quarantine any Door for safety reasons, legally and indefinitely, which makes them the quiet nightmare of every Noble House with a trade route to protect."
      ] },
    { id: "guild-soil-stewards", plane: "dornalis", cat: "Guilds", name: "The Soil-Stewards",
      text: ["The Agrarians. Largest guild by membership. The People's Guild — Verdant and Grain planes, deep Tribune ties."],
      detail: [
        "The Stewards manage the workers on the Threshers and oversee the ecology of the Verdant and Grain planes that feed the city. They are the largest guild by membership and have the deepest ties to the Tribunes — the people's representatives in the Senate.",
        "They are called the People's Guild, and they have earned it. Do not mistake that for weakness."
      ] },
    { id: "guild-glass-binders", plane: "dornalis", cat: "Guilds", name: "The Glass-Binders",
      text: ["The Tech-Makers. Working District. Phones, runic telegraphs, Needle Gate glass — quiet leverage in every hand."],
      detail: [
        "Out of the Working District, the Glass-Binders manufacture the hardware of everyday life — phones, runic telegraphs, and the glass panels used in Needle Gates. Evelyn Reed works here as an assistant; the guild's floors are ordinary until they are not.",
        "Their power is quieter than most: they do not threaten blackouts or strikes. They just make the things every citizen touches every single day, which turns out to be its own kind of leverage."
      ] },
    { id: "guild-marrow-healers", plane: "dornalis", cat: "Guilds", name: "The Marrow-Healers",
      text: ["The Bio-Techs. Sanctuary. Public health, Life-plane resources, Marrow-Inks — Senate standing money cannot buy."],
      detail: [
        "The Sanctuary is their home, and public health is their mandate. The Healers draw resources from Life-heavy planes to staff the city's hospitals and produce the Marrow-Inks used in Blood-Rune work.",
        "They are widely considered the most moral guild in the city, which gives them a Senate standing that money alone cannot buy. Whether they deserve the reputation is a question best asked quietly."
      ] },
    { id: "guild-deep-miners", plane: "dornalis", cat: "Guilds", name: "The Deep-Miners",
      text: ["The Resource Extractors. Someone has to go through the Door. Gold, stone, sand — the promise behind the currency."],
      detail: [
        "Someone has to actually go through the Door. The Miners operate on the other side — managing extraction across the stone and sand planes, pulling the gold that backs the city's currency and fills House Sterling's vaults.",
        "Without them, the whole financial system is a promise with nothing behind it. They are aware of this. House Sterling is also aware of this. The relationship is complicated."
      ] },

// ---------------- Alathia ----------------
    { id: "alathia", plane: "alathia", cat: "Places", name: "Alathia", pron: "Uh-LAY-thee-uh",
      text: [
        "An elvish plane with five moons: Thalessiel, Vaelora, Miraeth, Fenlyr, and Aurelith. If Karthmore is a city that bends the multiverse to its will, Alathia is a city that asked nicely and was welcomed in.",
        "You reach Alathia only through a Velo-Script door."
      ] },
    { id: "eldralore", plane: "alathia", cat: "Places", name: "Eldralore", pron: "El-druh-lore",
      text: ["The forest that holds Virelune, built into and around twelve ancient trees massive enough to house entire districts within and around their trunks. Nearly three miles of walkways, bridges, and paths connect every level, soft underfoot but firm — everything here was grown before it was built, and it shows."] },
    { id: "sylvaren", plane: "alathia", cat: "Places", name: "Virelune", pron: "VEER-uh-loon",
      text: [
        "The solarpunk city of Alathia, rising from the forest floor to above the canopy in tiers of living wood, quartz, and a light blue glass that catches and holds light like the city itself is breathing.",
        "The lower tiers, close to the forest floor and near dark, are Drow territory. The middle tiers, deep in the canopy's green light, hold the Wood Elves. The upper tiers break above the treeline into open sky, home to High Elves and Angels who want to live closest to the light and the wind. None of this is a hierarchy — anyone may live anywhere; the tiers are preference, not rank."
      ] },
    { id: "alathia-senses", plane: "alathia", cat: "What it feels like", name: "The air, the smell, the sound",
      text: [
        "Alathia adjusts to whoever is standing in it. The Aether in its air reads the body it surrounds and offers exactly what that body needs — a dwarf might feel a forge-room hundred degrees while a human beside them feels a perfect seventy-five. Open your mouth and it is hot and dry, like a desert at noon; breathe it in and it turns cool and green, like a forest after rain.",
        "The smell is layered and personal. Everyone gets cinnamon and lavender from the open air. Elves smell maple smoke without fire. Angels smell burnt wood and fresh sap. Karthmore citizens, their senses dulled by years of Lead-Runic Shielding, smell nothing from the trees at all — the city offers what it recognizes in you, and gives nothing back if it finds nothing.",
        "The sound is two cities at once: birdsong and swaying leaves underneath, sandals on wooden walkways and the groan of bridges above, and cutting through both, the sweep of angel wings passing overhead. Karthmore hums and clangs and shouts. Alathia breathes."
      ] },
    { id: "alathia-day-night", plane: "alathia", cat: "What it feels like", name: "Day and night",
      text: [
        "Alathia does not sleep. It changes shifts. By day the High Elves and Angels fill the upper tiers and open walkways, and the quartz scatters the sun across the canopy. By night the blue glass stops catching light and starts generating it, small lanterns turn every bridge into something like a constellation, and the Drow come out — apothecaries, enchanters, witches, and merchants moving door to door through the lower and middle tiers, selling from lantern-lit carts. The daytime city is grand and open. The nighttime city is intimate and warm. Both are Alathia."
      ] },
    { id: "the-gift", plane: "alathia", cat: "Ideas", name: "The Gift and the Passport",
      text: [
        "Every elf born in Alathia carries the Gift — an innate connection to the Aetherial plane allowing natural planar travel with no door frame at all. It is older than Velo-Script and requires nothing but the elf themselves.",
        "The Gift survives travel and distance. What kills it is a man-made door: the Lead-Runic Shielding in Karthmore's metal frames filters out Aetherial Mana, and that filtration disrupts the Gift at a cellular level, permanently. Chalk doors, which let the Aether flow unfiltered, carry no such risk.",
        "This is why every elf leaving Alathia carries papers, tracked by a small collective — not border control, but care. An elf who returns having lost the Gift finds the city already adjusting for them: new work, new income, no judgment."
      ] },
    { id: "alathia-government", plane: "alathia", cat: "Ideas", name: "Government",
      text: ["Alathia has no senate, no noble houses, and no guilds. A small collective of elves tracks who leaves, who returns, and what they need when they come back. That is the entirety of their mandate — no political power in the traditional sense, just records and help."] },
    { id: "alathia-relations", plane: "alathia", cat: "Relations", name: "Karthmore, Krag Doss Ner, and the Rebellion",
      text: [
        "Alathia and Karthmore keep open relations and free travel, though the tension lives in the forest: Karthmore logs several hundred miles from Eldralore's outer edge, close enough to concern Alathia and far enough to be tolerated. When Karthmore tests the boundary further, Alathia stops them — quietly, firmly, without escalation. Nobody in Karthmore's military wants a fight with a city of elves who need no door and angels who carry swords of fire.",
        "Alathia's warmest relationship is with Krag Doss Ner. The two share a chalk door between two identical pubs, one in each city, unofficial and open to any citizen of either.",
        "Alathia takes no side in Karthmore's rebellion. What it does is leave the forest open — Eldralore is a sanctuary for Rebellion forces, on the single unwritten condition that no harm comes to Alathia itself."
      ] },
    { id: "alathia-different", plane: "alathia", cat: "Relations", name: "What makes Alathia different",
      text: ["There is no crime here worth recording, no political factions, no debt system, no Marrow-Tax. The only real tension Alathia carries is the tension of standing still — a city that has decided what it is, and treats every new door or expanded district as a threat to be weighed rather than a goal to chase."] },

    // ---------------- Krag Doss Ner ----------------
    { id: "krag-doss-ner", plane: "krag", cat: "Places", name: "Krag Doss Ner", pron: "Krag-doss-NEER",
      text: [
        "A dwarvish plane with a single moon, Bronnvar. If Alathia is a city that grew, Krag Doss Ner is a city that was carved — built into, under, and across a plane of nothing but mountains, valleys, and active volcanoes.",
        "There is no sun and no day-night cycle: the sky simply glows a permanent red, from a chemical reaction between volcanic output and centuries of mining. You reach Krag Doss Ner only through a Velo-Script door."
      ] },
    { id: "khul-dar-ness", plane: "krag", cat: "Places", name: "Khul-Dar-Ness", pron: "Khuul-DAR-ness",
      text: [
        "The steampunk city of Krag Doss Ner. From a distance it reads as dark stone towers on the mountainsides — watch-posts and warehouses, not where the city actually lives. That's below, in a natural cavern half a mile in volume, built around rather than reshaped, so the city feels ancient before it feels built.",
        "Nothing here runs vertical. Most buildings hold to three stories, spreading wide across the cavern floor; guild halls and government buildings push to five. Brass and copper pipes run along every wall, carrying volcanic heat up from the power level, and the ground is cut stone, worn smooth by centuries of boots and cart wheels."
      ] },
    { id: "krag-senses", plane: "krag", cat: "What it feels like", name: "The smell, the sound, the ale",
      text: [
        "Krag Doss Ner announces itself by smell before anything else: copper and zinc, a faint sweetness of refined gold, and the warm wet heaviness of steam through the pipes. The sound is relentless — hammers, hissing steam, the mine-cart network, market chatter, and somewhere, always, the creative profanity of a dwarf whose forge isn't cooperating.",
        "The ale is brewed in vats of Aethrium, a metal forged from processed solid Aether, and it tastes different to whoever is drinking it — the metal reads the drinker the way Alathia's air does. It is, incidentally, the reason ale tax evasion is the city's most persistent legal problem."
      ] },
    { id: "krag-rhythm", plane: "krag", cat: "What it feels like", name: "No day, no night",
      text: ["The blue lights never dim. People sleep when they're tired and work when they're ready, and the guild council manages resources, not schedules. The quiet periods — forges cold, only the markets and mines running — are when the city looks most alive: people wandering, drinking, existing in the space rather than working through it."] },
    { id: "krag-government", plane: "krag", cat: "Ideas", name: "The Guild Council",
      text: ["Krag Doss Ner runs on a guild council that actually functions: the Mining Guild decides when to dig deeper, the Builders Guild decides when a bridge is needed, the Farming Guild manages the grow levels. No Noble Houses, no Iron-Tape Commission burying decisions in litigation. Crime is close to nonexistent — in a plane where diamonds are as common as gravel, there's nothing worth stealing."] },
    { id: "krag-doors", plane: "krag", cat: "Ideas", name: "Doors, ore, and the 24-hour leash",
      text: [
        "Krag Doss Ner's doors reach other planes, including Karthmore, whose economy runs on its ore. Karthmore is permitted exactly 500 pounds a week — three minecarts. Not a compromise. A leash, and both sides know it.",
        "Karthmore citizens get 24 hours inside Krag Doss Ner, no extensions, checked against Karthmore's own citizen registry — a city built by its people, with no interest in outside political structures absorbing it, and even less interest in importing Karthmore's attitude toward other planes."
      ] },
    { id: "krag-relations", plane: "krag", cat: "Relations", name: "Alathia and the Rebellion",
      text: [
        "Krag Doss Ner's warmest relationship is with Alathia — the same shared chalk door, unofficial on both sides. Where Krag Doss Ner is carved downward into rock, Alathia is built upward into wood; the instinct underneath is identical.",
        "When the Rebellion comes looking for weapons, Krag Doss Ner occasionally obliges — not out of solidarity, but the quiet satisfaction of annoying Karthmore. They take no side and see no reason not to profit slightly from the whole situation."
      ] },
    { id: "krag-different", plane: "krag", cat: "Relations", name: "What makes Krag Doss Ner different",
      text: ["A city of makers that isn't trying to be anything other than what it is: loud, warm, slightly smoky, and completely at peace with itself. Nobody who lives here is in a hurry to leave, and nobody who visits on a 24-hour pass ever quite feels like they saw enough."] },

    // ---------------- Orrethis Heptavane (not a door — nobody survives to map it) ----------------
    { id: "orrethis-heptavane", plane: "orrethis", cat: "The Realm", name: "Orrethis Heptavane", pron: "The Orrery of Seven Vanes",
      text: [
        "Known titles: The Orrery of Seven Vanes, The Sevenfold Orrery, The Enclosing Armillary. Multiversal status: Unmapped / Extreme Hazard (High Aether Saturation).",
        "Formally recorded in ancient archives as Orrethis Heptavane, translating in planar dialects to \"The Orrery of Seven Vanes.\" To outside observers and astronomers the plane visually resembles a massive, nested Dyson sphere. Mechanically it functions as an Armillary Realm — a dynamic framework of interlocking, ring-shaped pocket domains pivoting around a motionless central Aether core.",
        "Mortal scholars assign temporary \"Homeworld [Letter]\" designations to newly discovered planes until local names are learned. Because Orrethis Heptavane’s extreme Aether saturation makes long-term survival impossible, no mortal explorer ever survived to survey it or learn its native name. Imperial cartographers list it simply as The Enclosing Armillary or Orrethis Heptavane.",
        "The realm consists of seven distinct ring-realms rotating around a motionless center. The Stasis Core is a motionless sphere of raw Aether where time stands completely still. Standers do not age, heal, or consume external time. It serves as the ultimate neutral arena for Celestial and Infernal factions to fight grand battles without burning time on their home planes. From the outside it is blindingly radiant due to massive Aether venting; standing on its surface it is strangely dark and light-absorbent.",
        "Seven rings turn around that core, each one home to a different people:"
      ],
      list: [
        "Rings 1 & 2 — The Celestial Dominions (Angels & Nephilim): Modeled after classic Biblical depictions of Heaven. Gold-paved avenues, alabaster peaks, crystal seas, ivory sanctuaries, and high-altitude basilicas designed for winged transit",
        "Rings 3 & 4 — The Infernal Depths (Devils & Demons): Modeled after traditional Biblical hellscapes. Basalt mountains, lakes of liquid fire and brimstone, sulfur skies, and oppressive obsidian fortresses",
        "Ring 5 — The Primordial Domain (Jinn): Modeled after Islamic and Middle Eastern Jinn lore. Shifting deserts of golden sand, howling tempests of smokeless fire, and floating palaces of seamless brass, copper, and colored glass",
        "Ring 6 — The Dead Ring (The Open Warzone): A stripped, lifeless ring completely destroyed by past conflicts. Serves as an unpopulated, open warzone for full-scale military campaigns",
        "Ring 7 — The Burning Ring (The Rebuilding Zone): A heavily scarred domain undergoing massive structural reclamation, where multi-species workforces rebuild broken infrastructure"
      ] },
    { id: "orrethis-aether", plane: "orrethis", cat: "Aether & Survival", name: "Living in a hostile paradise",
      text: [
        "The realm is saturated with raw Aether. Unadapted mortal races suffer rapid Aetheric poisoning and die. External immortals — such as Vampires — quickly become sick, decay, and perish if they attempt to remain. The physical forms, supernatural gifts, and distinct features of Angels, Nephilim, Devils, Demons, and Jinn are evolutionary adaptations resulting from millennia of absorbing this high-density energy.",
        "Each populated ring acts as a tailored paradise for its native species, providing effortless, invigorating living conditions. To non-natives these same environments feel like literal hell or blinding, suffocating radiation.",
        "Natives possess an internal compass that always pulls toward their home ring. Traversing a foreign ring induces severe physical agony and sensory distress, making movement nearly impossible for physical beings. Because Jinn exist natively in non-corporeal forms (smokeless fire and elemental energy), they lack physical flesh to degrade and navigate foreign rings without agony — making them premier scouts, spies, and couriers.",
        "When a rotating ring aligns with an outside plane, a transit bridge opens for at most one hour. Anyone stranded after the window closes who jumps off the edge faces two unpredictable outcomes: a planar drop that lands them randomly on a completely unknown plane, or the unknown endless fall through the unmapped void."
      ] },
    { id: "orrethis-culture", plane: "orrethis", cat: "Culture & Power", name: "Culture, factions, and leadership",
      text: [
        "Celestial rings emphasize order, sacred rituals, and divine hierarchy. Infernal rings revolve around martial dominance, feudal pacts, and legalistic contracts. The Primordial ring centers on elemental freedom and artistic mastery. Specific domestic traditions and daily habits remain entirely unrecorded in mortal archives due to the impossibility of long-term observation by outside scholars.",
        "Each ring is ruled by a supreme authority known to outsiders as a Ring Leader. They act as absolute rulers and planar ambassadors. Any outsider seeking passage across a ring must obtain the explicit blessing and warding of its Ring Leader to avoid dying to the environment.",
        "Organized labor unions, trade guilds, and mercenary houses do not exist. Because all natives are immortal, individuals have infinite time to achieve self-mastery in skills like smithing or architecture without needing instructional guilds. Labor is rendered through oath, fealty, or direct contract."
      ] },

    // ---------------- Shensora, the Spirit Realm ----------------
    { id: "shensora", plane: "shensora", cat: "Places", name: "Shensora",
      text: [
        "Open plains and gentle rolling hills lead into a snowy mountain range, which flows down into subterranean tunnels, deep ravines, and crystal-lit caverns — and four very different peoples have settled each layer of it.",
        "The Meadow-Sprawl & Terraced Valleys (Kitsune & Tanuki): dozens of small, cozy villages scattered across open plains, flower meadows, and hill country. Sprawl terrace farms stepped into the hillsides sit alongside one- to two-story timber-frame buildings and earth-sheltered, Hobbit-hole style homes connected by simple dirt footpaths.",
        "The Outer Citadel & Mountain Halls (Oni & Tengu): a massive fortress carved directly into the mountain face. Towering hand-carved stone pillars and massive dark gates open into deep stone halls, vaulted ceilings, and fortified mountain structures.",
        "The Crystal Ravines & Subterranean Runways (Kappa): long, winding tunnel networks branching deep under the mountains into massive ravines. Giant, naturally growing crystals cast light across cavern walls, stone platforms, and wooden suspension bridges spanning a clear river.",
        "The Upside-Down Sub-Realm (Changelings): a sub-plane occupying the exact same physical coordinates as the realm, but inverted. Travelers walk across dense cloud layers with mountains and subterranean structures hanging suspended above them.",
        "Significant populations of Kitsune, Tanuki, Oni, Tengu, Kappa, and Changelings also live in Karthmore as long-term residents, traders, and workers. The census and Field Guide record them there; Shensora remains their native home and the place whose air first shaped their kind."
      ] },
    { id: "shensora-senses", plane: "shensora", cat: "What it feels like", name: "Air, sound, and food",
      text: [
        "Atmospheric density, weather patterns, and riverways closely mirror the baseline environment of Alathia.",
        "Meadows carry gentle warm breezes, songbirds, and buzzing bees. Mountains howl with wind and crunching snow, and every minute colossal bells ring from some unknown high-altitude source. Ravines echo with footsteps, creaking wooden bridges, and the rhythmic clanking of iron chains.",
        "Food stays culturally distinct and does not physically transform outsiders who eat it. Meadow villages offer meats, farm produce, honey, and eggs; the mountain fortress relies heavily on red meats and alcohol; the crystal depths cultivate herbs and mushrooms and trade them surface-bound for spices and meats."
      ] },
    { id: "shensora-rhythms", plane: "shensora", cat: "What it feels like", name: "Day and night",
      text: [
        "Shensora operates on the exact same calendar and day/night cycle as Alathia. The two are linked by close orbital proximity within planar space, similar to divine planets sharing a closely connected orbital plane."
      ] },
    { id: "shensora-government", plane: "shensora", cat: "Ideas", name: "Three governments, one realm",
      text: [
        "Jurisdiction is strictly regional under normal conditions, but a fugitive fleeing into a neighboring zone triggers cross-border law enforcement cooperation.",
        "The Meadow-Sprawl is governed by a Village Council of local community leaders. The Outer Citadel is a strict Monarchy. The Crystal Ravines are governed as a Bicameral Republic featuring two elected citizen bodies that pass laws and oversee regional justice."
      ] },
    { id: "shensora-aether", plane: "shensora", cat: "Ideas", name: "What the air does to you",
      text: [
        "High concentrations of raw Aether permeate the air and ambient environment. Over generations, absorbing this raw atmospheric Aether mutated native populations from localized subspecies into entirely distinct magical races, granting native shapeshifting, illusion craft, and physical resilience. It is the same logic behind Orrethis Heptavane’s rings, at a gentler, survivable dose.",
        "Entering Shensora is hazardous for humans — equivalent to walking into Chernobyl without a hazmat suit because of atmospheric Aether toxicity. Travel from Karthmore is heavily regulated. Planes like Alathia and Krag Doss Ner have unrestricted access, though entry destination within the realm is managed (meadow portals allow immediate entry; mountain fortress entry requires up to one week’s notice). Shensora residents face no restrictions leaving their home plane and travel across worlds at will."
      ] },
    { id: "shensora-relations", plane: "shensora", cat: "Relations", name: "The non-hostility pact",
      text: [
        "Interactions with Karthmore are strictly limited to travel and transit. There is zero trade conducted with Karthmore, and military presence or militarization of any kind is entirely forbidden within Shensora. Travelers from Karthmore are granted entry solely on the condition that they honor an explicit non-hostility pact; any violation immediately revokes travel privileges.",
        "The Rebellion fully respects Shensora’s non-aggression agreement and refuses to conduct military operations, skirmishes, or rebellion business on Spirit Realm soil. Rebellion members are permitted to pass through, purchase local supplies, and buy food, provided they cause no harm to the inhabitants or the environment. Local regional governments tolerate the Rebellion’s presence strictly under these conditions — any breakdown in order or violence results in immediate expulsion."
      ] },
    { id: "shensora-different", plane: "shensora", cat: "Relations", name: "What makes Shensora different",
      text: [
        "The defining feature of Shensora is its atmospheric saturation of raw Aether. Unlike planes where magic is locked in the earth or drawn through subtle ley lines, the air itself here is a potent, transformative force — capable of actively mutating, shaping, and altering the biological nature of the beings who dwell within it over time."
      ] }
  ],

  cast: [
    { name: "Evelyn Reed", kind: "Human", text: "A Glass-Binders Guild assistant who did not plan on becoming interesting to a rebellion. Protagonist of the primary series." },
    { name: "Corven Cain", kind: "Vampire", text: "A 113-year-old war veteran and the unclaimed Governor of Ravenscourt. He has his own companion series, and he will happily cite the relevant law." },
    { name: "Thessaly Ravenscourt", kind: "Pureblood vampire", text: "Potentate of House Ravenscourt. She has held both the Governor's seat and the Potentate's, and she will fight politically and physically to keep them." },
    { name: "Lyra", kind: "Drow-kin", text: "Owns a coffee shop in the Warrens and is Evelyn's close companion." },
    { name: "Remus Wolfgar Mathews", kind: "", text: "The charismatic public leader of the Rebellion. He gives a very good speech." },
    { name: "Verin Thorn", kind: "Shifter", text: "A war buddy turned rival gang leader." },
    { name: "Moriel Hollowyn", kind: "Half-Drow, half-Witch", text: "An apothecary whose shop sits on contested gang territory, which is hard on business and harder on sleep." },
    { name: "Nelathar", kind: "God", text: "Worshipped by the Cult of the Fallen. Three syllables, soft in the middle. If you're saying the name aloud, you're either a scholar or somewhere you shouldn't be." }
  ],

  // FIELD GUIDE: an unofficial companion to the Registry. Grouped by folklore
  // family, in the order the groups should print.
  fieldGuide: {
    label: "A Visitor's Field Guide to the Races",
    byline: "Unofficial. Not published by anyone who would admit to it.",
    groups: [
      { group: "The Common Mortal Races", entries: [
        { name: "Humans", text: "Humans are everywhere, which is either reassuring or exhausting depending on your disposition. Baseline biology, no innate magic — they compensate with wearable runic tech, rings and bracers that do the work their blood won't. Long-term plane exposure leaves its marks: spend enough time in the Conduit and your hair starts holding a static charge. They run the Senate, staff the Commission, and own more small businesses per capita than any other race. If something bureaucratic is happening, a human is probably involved." },
        { name: "High Elves", text: "High Elves move through the Scriptum like they own it, which several of them technically do. Luminous skin, metallic gold or silver hair, and pupils that shift shape depending on which plane they're looking at. They are the Lexicon Scribes' preferred demographic and the reason the Scriptum feels faintly competitive even on a quiet afternoon." },
        { name: "Wood Elves", text: "Wood Elves are easiest to spot by the bark-like texture of their skin and eyes that run the full spectrum of an autumn canopy. They work the Verdant farm planes almost exclusively and show up in the Sanctuary when something in the ecology needs fixing. Generally the least interested in city politics of any Elf variant." },
        { name: "Drow", text: "Drow carry bioluminescent tattoos that glow faintly in low light, a useful trait in the Fringe, where several of them have made careers in the Glass-Eye Agency. Obsidian skin, pale or lavender hair, and a reputation that precedes them wherever they go. Most of it is earned." },
        { name: "Dwarves", text: "Dwarves are broad, dense, and built for the Anvil. The Graft-Beards are the easiest identifier: conductive filaments woven directly into their facial hair to ground lightning when working runes. Don't comment on them. They know they look unusual. They don't care." },
        { name: "Gnomes and Halflings", text: "Gnomes and Halflings occupy the precision end of the city's technical workforce. Gnomes tend toward ink-stained skin from handling high-concentrate mana dyes. Halflings look like proportional miniature humans and are almost universally better at accounting than you. Both are significantly more dangerous in a negotiation than they appear." },
        { name: "Orcs and Half-Orcs", text: "Orcs and Half-Orcs are the backbone of the Wharf and the Ring. The Threshold Calluses, thickened skin across the hands and shoulders from pushing heavy freight through high-pressure doors, are the mark of a working Orc. Lower tusks, slate to olive skin, and a physical presence that tends to clear a path without anyone meaning to step aside." }
      ]},
      { group: "The Celestial and Infernal", entries: [
        { name: "Angels", text: "Angels range from the genuinely terrifying, rings of fire, multiple wings, eyes where eyes shouldn't be, to the quietly unsettling: humanoid figures of white marble and soft light that hover slightly above the floor at all times. They don't touch the ground. Dornalis-Contamination, they call it. They work the Sanctuary's high guard and advise the Senate on planar matters. They are uncommon, they know it, and they carry themselves accordingly. Their true homeland is a ring of Orrethis Heptavane, though few who go looking for it come back to describe it." },
        { name: "Devils", text: "Devils are impeccably dressed and faintly smell of ozone. Horns kept neat, tails kept still in professional settings. They are the city's preferred contract arbitrators — there is something about having a Devil review an agreement that tends to discourage bad faith. They keep offices in the Fringe and quietly maintain a second presence in Crown Apex that nobody officially acknowledges. Like Angels, they trace their bloodline back to a ring of Orrethis Heptavane." },
        { name: "Demons", text: "Demons are less polished and more present. Chaotic energy flickers visibly off some of them. They do the dirty work that Devils consider beneath their station, and they live in the Under-City beneath the Fringe, where the architecture is less regulated and the smell of sulfur is considered ambient. Their kind's true home lies in the same distant ring as the Devils' — Orrethis Heptavane." },
        { name: "Nephilim", text: "Nephilim are what happens when celestial and mortal bloodlines cross. Too symmetrical, too still, with a faint gold or silver glow behind the eyes. They leave glowing footprints that fade after a few seconds. They work as high-end bodyguards and Aether-Calibration specialists and live in the most secure penthouses in Crown Apex. Nobody bothers them. This is intentional. Half a ring of Orrethis Heptavane runs in their blood, whichever side their other half comes from." },
        { name: "Jinn", text: "Jinn dissolve below the waist into smokeless fire or swirling vapor, and their skin shifts like desert sand or stormcloud depending on mood and lineage. They thrive in the Conduit's heat and run the city's high-speed transit systems faster than any other race is willing to. It's a useful trait for a people whose true home, a ring of Orrethis Heptavane, kills anything with flesh to break down." }
      ]},
      { group: "Eastern and Spirit Folklore", entries: [
        { name: "Kitsune", text: "Kitsune can pass for human when they want to; Veil-Runes hide the ears and tails from casual observation. The number of tails indicates mana capacity — a nine-tail Kitsune in the room is either a very powerful person or someone who very much wants you to think they are. They move through the Nexus and the Scriptum as data-brokers and entertainers, and the Glass-Eye Agency recruits from them heavily." },
        { name: "Tengu", text: "Tengu are avian-humanoids ranging from fully beaked to long-nosed and winged-cloaked depending on lineage. They staff the Iron Ring as courier-scribes and martial arts instructors. Fast, precise, and not particularly interested in conversation." },
        { name: "Oni", text: "Oni are large, brightly colored, red, blue, yellow, and carry Kanabo clubs etched with gravity runes that they use with more finesse than the size of the weapon suggests. They live primarily in the Warrens and work heavy machinery in the Anvil. They are louder than most of their neighbors and completely unapologetic about it." },
        { name: "Kappa", text: "Kappa are turtle-like water-dwellers who handle the Wharf's water purification and a meaningful portion of waste management. Practical, quiet, and happiest when near moving water." },
        { name: "Tanuki", text: "Tanuki are their Fringe-dwelling counterparts — raccoon-like, portly, and almost professionally involved in black-market trade. If something moved through the Warrens without a paper trail, a Tanuki probably touched it at some point." }
      ]},
      { group: "European and Mythic Folklore", entries: [
        { name: "Vampires", text: "Vampires are the city's old money made flesh. Pale, elegant, pulseless, and almost exclusively concentrated in Crown Apex behind fortified, windowless estates. They have been aristocracy long enough that it stopped being a performance. They simply are. Feeding is a matter of strict biological necessity: small channels within their fangs lead directly to the esophagus, letting blood pass cleanly into the stomach, where the vampire's digestive system breaks it down to extract specific proteins and enzymes. They feed primarily on globulins, roughly 35 to 38 percent — using alpha and beta globulins for the transport of iron, copper, lipids, and fat-soluble vitamins, alongside gamma globulins and inactive coagulation proenzymes like prothrombin and plasminogen." },
        { name: "Lycans", text: "Lycans run warm: body temperature, scent, and a low-level restlessness that makes humans faintly uncomfortable in enclosed spaces with them. They serve in the Iron Ring's tracking units and live in communal barracks or on the wilder farm planes when they need room. Lunar cycle management is a standard line item in Ring scheduling." },
        { name: "Satyrs, Fawns, Centaurs, and Minotaurs", text: "Satyrs and Fawns work the Verdant and show up in the Fringe on their time off, which is frequently. Centaurs and Minotaurs handle inter-district heavy transport: Centaurs between the open districts, Minotaurs in the high-ceiling warehouses of the Wharf where the scale of the cargo suits them." },
        { name: "Dryads and Nymphs", text: "Dryads and Nymphs have skin that mimics their environment: wood grain, water surface, stone face, depending on their elemental origin. They are bound to the Life-Arches in the Sanctuary's hospitals and make up a significant portion of the environmental science workforce on the farm planes." },
        { name: "Selkies", text: "Selkies live in the Wharf's submerged Wet-Docks and work marine piloting. They shed their sealskins to walk on land, and the skins are kept in locked personal lockers at the dock — losing one is not something the Wharf takes lightly." },
        { name: "Banshees", text: "Banshees operate the city's runic telegraph arrays from the Conduit, which suits everyone: their vocal abilities and the communication infrastructure are naturally compatible, and it keeps them away from residential areas." },
        { name: "Gargoyles", text: "Gargoyles live on the rooftops of Crown Apex estates and serve as perimeter defense. Living stone. They don't sleep so much as go still." }
      ]},
      { group: "The Artificial and Created", entries: [
        { name: "Golems", text: "Golems come in clay, stone, and iron variants depending on their intended load. Glowing runes at the joints indicate charge level. When not active they rest in Charging Racks in the Anvil. They do not dream, as far as anyone has been able to determine." },
        { name: "Automata", text: "Automata are brass and clockwork, integrated so deeply into the Scriptum's archive systems that the distinction between tool and staff has become genuinely unclear. They process, translate, and record with perfect accuracy and zero editorial opinion, which makes them either ideal archivists or slightly unnerving colleagues depending on who you ask." },
        { name: "Homunculi", text: "Homunculi are small, jar-grown, and look like simplified versions of whoever made them. They assist in the Marrow-Clinics and serve as laboratory scouts in spaces too small for anyone else. They have their own small dwellings within the Sanctuary. Nobody is entirely sure how they feel about their situation. Nobody has formally asked." }
      ]},
      { group: "The Cryptid and Rare", entries: [
        { name: "Valravn", text: "Valravn are supernatural raven-humanoids who congregate in the high-perch rafters of the Fringe and work as assassins or spies. They are not social in the conventional sense." },
        { name: "Changelings", text: "Changelings wear masks, always, and blend into the Warrens' human population without effort. The Commission has no reliable census data on them. The number listed is an estimate, and almost certainly low." },

const $main = document.getElementById('main');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const paras = a => a.map(p => `<p>${esc(p)}</p>`).join('');
const planeBy = k => SITE.planes.find(p => p.key === k);
const cityBy = k => SITE.cities.find(c => c.key === k);
const citiesOf = k => SITE.cities.filter(c => c.plane === k);
const asArr = x => Array.isArray(x) ? x : [x];

/* ---- World themes: built from each world's "color" unless it supplies its own ---- */
function hexToHue(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return 40;
  const n = parseInt(m[1], 16), r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), d = mx - Math.min(r, g, b); if (!d) return 40;
  const h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return Math.round((h * 60 + 360) % 360);
}
const hsl = (h, s, l) => `hsl(${h} ${s}% ${l}%)`;
function planeTheme(p){
  const v = p.vars || {}, t = p.theme || {}, base = p.color || v.a || '#10b981', h = hexToHue(base);
  return {
    door: { a: v.a || base, bg1: v.bg1 || hsl(h, 35, 14), bg2: v.bg2 || hsl(h, 35, 24) },
    page: { ink: t.ink || hsl(h, 30, 8), ink2: t.ink2 || hsl(h, 28, 12), ink3: t.ink3 || hsl(h, 26, 18),
            accent: t.accent || base, accent2: t.accent2 || hsl((h + 45) % 360, 55, 78) }
  };
}
const planeAccent = k => { const p = planeBy(k); return p ? planeTheme(p).door.a : '#10b981'; };
function cityTheme(c){ return planeTheme({ color: c.color }); }
function applyTheme(key, city){
  const src = city ? cityTheme(city) : (planeBy(key) ? planeTheme(planeBy(key)) : null);
  const st = document.body.style;
  const map = { '--ink': 'ink', '--ink-2': 'ink2', '--ink-3': 'ink3', '--accent-2': 'accent2' };
  Object.keys(map).forEach(k => src ? st.setProperty(k, src.page[map[k]]) : st.removeProperty(k));
  /* Keep --accent as site-wide emerald for links/buttons; world colors only tint backgrounds & doors */
  if (src) st.removeProperty('--accent');
}
const moonWord = n => ({0:'No moons',1:'One moon',2:'Two moons',3:'Three moons',4:'Four moons',5:'Five moons'}[n] || n + ' moons');
const fmtDate = d => new Date(d + 'T00:00:00Z').toLocaleDateString('en-US', {timeZone:'UTC', year:'numeric', month:'long', day:'numeric'});
const postsSorted = () => SITE.posts.slice().sort((a, b) => b.date.localeCompare(a.date));

/* ---- Skyline: generated once from a fixed seed so it never changes ---- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function skyline(){
  const rnd = mulberry32(1731), R = (a, b) => a + rnd() * (b - a);
  const W = 1600, H = 620, f = n => n.toFixed(1);
  const layers = [
    { fill:'#34305a', minH:120, maxH:280, minW:60, maxW:130, win:0 },
    { fill:'#242247', minH:150, maxH:340, minW:50, maxW:120, win:.05 },
    { fill:'#15162f', minH:110, maxH:400, minW:44, maxW:110, win:.17 }
  ];
  let out = '';
  layers.forEach(L => {
    let x = -30, body = '', lights = '';
    while (x < W + 30) {
      const w = R(L.minW, L.maxW), h = R(L.minH, L.maxH), top = H - h, kind = rnd();
      body += `<rect x="${f(x)}" y="${f(top)}" width="${f(w)}" height="${f(h)}"/>`;
      if (kind < .25) {
        const sh = R(50, 130);
        body += `<polygon points="${f(x+w*.18)},${f(top)} ${f(x+w*.5)},${f(top-sh)} ${f(x+w*.82)},${f(top)}"/>`;
      } else if (kind < .42) {
        body += `<ellipse cx="${f(x+w/2)}" cy="${f(top)}" rx="${f(w*.42)}" ry="${f(R(22,46))}"/>`;
      } else if (kind < .6) {
        body += `<rect x="${f(x+w*.2)}" y="${f(top-R(30,70))}" width="${f(w*.6)}" height="90"/>`;
      } else if (kind < .75) {
        const cw = R(8, 14), ch = R(50, 120);
        body += `<rect x="${f(x+w*.65)}" y="${f(top-ch)}" width="${f(cw)}" height="${f(ch+2)}"/>`;
        body += `<rect x="${f(x+w*.3)}" y="${f(top-ch*.6)}" width="${f(cw*.8)}" height="${f(ch*.6+2)}"/>`;
      }
      if (L.win) {
        const cols = Math.floor((w - 16) / 16), rows = Math.floor((h - 24) / 22);
        for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
          if (rnd() < L.win) {
            const col = rnd() < .85 ? '#f0c078' : '#b7b1e8';
            lights += `<rect x="${f(x+8+c*16)}" y="${f(top+14+r*22)}" width="5" height="8" fill="${col}" opacity="${f(R(.5,1))}"/>`;
          }
        }
      }
      x += w * R(.6, 1);
    }
    out += `<g fill="${L.fill}">${body}</g>${lights}`;
  });
  return `<svg class="skyline" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMax slice" aria-hidden="true" focusable="false">${out}</svg>`;
}

    return { title: 'A Traveler\'s Guide to Pronunciation', plane: 'dornalis', html: `
      <div class="wrap">
        <div class="page-head">
          <a class="back" href="#/worlds">Back to all worlds</a>
          <h1>A Traveler's Guide to Pronunciation</h1>
          <p class="lede">Updated master edition. Covers every named world, nation, city, character, faction, and calendar term established to date.</p>

              ${row('Moons', 'moons')}${row('Week', 'week')}${row('Month', 'month')}${row('Months in a year', 'months')}${row('Year', 'year')}${row('Seasons', 'seasons')}

          <div class="prose" style="margin-top:1.5rem">${paras(SITE.calendarNotes)}</div>

          <h2 style="margin-top:4rem">The Worlds (Planes)</h2>

          <h2 style="margin-top:3rem">Nations & Cities</h2>
          ${sayGroup('', P.places || [])}
          <h2 style="margin-top:3rem">Characters</h2>
          ${sayGroup('', P.characters || [])}
          <h2 style="margin-top:3rem">Magic & Key Terms</h2>
          ${sayGroup('', P.terms || [])}

          <p class="lede" style="margin-top:3rem;font-style:italic">Welcome to Dornalis. Mind the Iris.</p>
        </div>
      </div>`};
  },

  peoples(){
    const R = SITE.registry, FG = SITE.fieldGuide;
    let ticks = '';
    for (let i = 0; i < 24; i++) {
      const a = i * Math.PI / 12, c = Math.cos(a), sn = Math.sin(a);
      ticks += `<line x1="${(32+c*27).toFixed(1)}" y1="${(32+sn*27).toFixed(1)}" x2="${(32+c*30).toFixed(1)}" y2="${(32+sn*30).toFixed(1)}"/>`;
    }
    const seal = `<svg class="seal" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
      <g fill="none" style="stroke:var(--accent)" stroke-width="1.2"><circle cx="32" cy="32" r="30.5"/><circle cx="32" cy="32" r="25"/>${ticks}</g>
      <circle cx="27" cy="32" r="10" fill="#b7b1e8"/><circle cx="39" cy="31" r="6.5" fill="#f0c078"/></svg>`;
    return { title: R.title, plane: 'dornalis', html: `
      <div class="wrap">
        <div class="page-head">
          <div class="notice">
            ${seal}
            <div>
              <p class="issuer">${esc(R.issuer)}</p>
              <h1>${esc(R.title)}</h1>
              <p class="filed">${esc(R.posted)}</p>
            </div>
          </div>
          <div class="prose notice-intro">${paras(R.intro)}</div>
        </div>
        <div class="page-body">
          <div class="table-wrap"><table class="cal census">
            <thead><tr><th scope="col">Race</th><th scope="col">% of population</th><th scope="col">Primary district</th><th scope="col">Social class</th></tr></thead>
            <tbody>${R.census.map(r => `
              <tr><th scope="row">${esc(r.race)}</th><td>${esc(r.pct)}</td><td>${esc(r.district)}</td><td>${esc(r.cls)}</td></tr>`).join('')}
            </tbody></table></div>
          ${R.censusNote ? `<p class="muted census-note">${esc(R.censusNote)}</p>` : ''}

          <h2 class="cat">Economic tiers</h2>
          <div class="tiers">${R.tiers.map(t => `
            <article class="tier"><h3>${esc(t.name)}</h3><p class="tier-peoples">${esc(t.peoples)}</p><p>${esc(t.text)}</p></article>`).join('')}
          </div>

          <div class="fg-head">
            <h2 class="cat">${esc(FG.label)}</h2>
            <p class="byline">${esc(FG.byline)}</p>
          </div>
          ${FG.groups.map(g => `
            <h3 class="realm">${esc(g.group)}</h3>
            <ul class="cast registry">${g.entries.map(e => `
              <li><div class="who">${esc(e.name)}</div><p>${esc(e.text)}</p></li>`).join('')}
            </ul>`).join('')}


        </div>
      </div>`};
  },

  characters(){
    return { title: 'Characters', plane: 'dornalis', html: `
      <div class="wrap">
        <div class="page-head"><h1>Characters</h1>
          <p class="lede">Faces you'll meet in Karthmore. Some of them will be pleasant. Most of them are already keeping score.</p></div>
        <div class="page-body"><ul class="cast">${SITE.cast.map(c => `
          <li><div class="who">${esc(c.name)}${c.kind ? `<span class="kind">${esc(c.kind)}</span>` : ''}</div><p>${esc(c.text)}</p></li>`).join('')}
        </ul></div>
      </div>`};
  },

  dispatches(parts){
    const [slug] = parts;
    if (slug) {
      const p = SITE.posts.find(x => x.slug === slug);
      if (!p) return views.notFound();
      return { title: p.title, plane: 'dornalis', html: `
        <div class="wrap">
          <div class="page-head">
            <a class="back" href="#/dispatches">Back to dispatches</a>
            <h1>${esc(p.title)}</h1>
            <p class="meta"><time datetime="${p.date}">${fmtDate(p.date)}</time></p>
          </div>
          <div class="page-body prose post-body">${paras(p.body)}</div>
        </div>`};
    }
    return { title: 'Dispatches', plane: 'dornalis', html: `
      <div class="wrap">
        <div class="page-head"><h1>Dispatches</h1>
          <p class="lede">News from the books, new lore as it gets written down, and notes from behind the curtain.</p></div>
        <div class="page-body"><ul class="post-list">${postsSorted().map(p => `
          <li><time datetime="${p.date}">${fmtDate(p.date)}</time>
            <h2><a href="#/dispatches/${p.slug}">${esc(p.title)}</a></h2>
            <p>${esc(p.summary)}</p></li>`).join('')}
        </ul></div>
      </div>`};
  },

  about(){
    return { title: 'About', plane: 'dornalis', html: `
      <div class="wrap">
        <div class="page-head"><h1>About</h1></div>
        <div class="page-body">
          <div class="split">
            <h2>The author</h2>
            <div class="prose"><p>${esc(SITE.bio)}</p>
              ${SITE.links.length ? `<ul>${SITE.links.map(l => `<li><a href="${esc(l.href)}" rel="noopener">${esc(l.label)}</a></li>`).join('')}</ul>` : ''}
            </div>
          </div>
          <div class="split" style="margin-top:3rem">
            <h2>The series</h2>
            <div class="prose"><p>Karthmore is one city on the plane of Dornalis, and it refuses to stay one story. Evelyn Reed's series comes first — guild politics, chalk doors, and a rebellion that does not take applications. A companion series follows Corven Cain: 113 years old, unclaimed Governor of Ravenscourt, and entirely too familiar with the city's forty-five articles of law.</p>
              <p><a href="#/series">Read about the series</a></p></div>
          </div>
        </div>
      </div>`};
  },

  notFound(){
    return { title: 'Page not found', plane: 'dornalis', html: `
      <div class="wrap"><div class="page-head"><h1>That page isn't here</h1>
        <p class="lede">The link may be old or mistyped. Head back to the <a href="#/">home page</a> or browse the <a href="#/worlds">worlds</a>.</p></div></div>`};
  }
};

/* ---- Router ---- */
function render(){
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
  const root = parts[0] || '';
  const key = ({ lore: 'worlds' })[root] || root;   // old #/lore links still work
  const routable = ['home','series','worlds','peoples','characters','dispatches','about'];
  const fn = key === '' ? views.home : (routable.includes(key) ? views[key] : null);
  const v = fn ? fn(parts.slice(1)) : views.notFound();
  document.body.dataset.plane = v.plane || 'dornalis';
  applyTheme(v.plane || 'dornalis', v.cityColor ? { color: v.cityColor } : null);
  document.title = v.title ? `${v.title} | ${SITE.title}` : `${SITE.title}: ${SITE.tagline}`;
  $main.innerHTML = v.html;
  document.querySelectorAll('#nav a').forEach(a => {
    if (a.dataset.r === key) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  if (v.after) v.after();
  const el = v.entry && document.getElementById('e-' + v.entry);
  if (el) {
    requestAnimationFrame(() => { el.scrollIntoView({ behavior: 'instant' }); el.classList.add('flash'); });
  } else {
    window.scrollTo({ top: 0, behavior: 'instant' });
  }
  $main.focus({ preventScroll: true });
}

/* ---- Chrome (header, footer) ---- */
document.getElementById('brand').innerHTML =
  `<svg viewBox="0 0 32 20" aria-hidden="true"><circle cx="12" cy="10" r="9" fill="#b7b1e8"/><circle cx="23" cy="10" r="6" fill="#f0c078"/></svg><span>${esc(SITE.title)}</span>`;
document.getElementById('nav').innerHTML =
  SITE.nav.map(n => `<li><a href="${n.href}" data-r="${n.r}">${esc(n.label)}</a></li>`).join('');
document.getElementById('foot').innerHTML =
  `<p>© ${new Date().getFullYear()} ${esc(SITE.author)}. All rights reserved. Creative content remains under copyright; the site code is available under the MIT License.</p>` +
  (SITE.links.length ? `<ul>${SITE.links.map(l => `<li><a href="${esc(l.href)}" rel="noopener">${esc(l.label)}</a></li>`).join('')}</ul>` : '') +
  (SITE.build ? `<p class="build">Site build ${esc(SITE.build)}</p>` : '');
document.querySelector('.skip').addEventListener('click', e => { e.preventDefault(); $main.focus(); });

/* ---- Smooth page changes: fade out, swap, fade the new page in in stages ---- */
const reduceMotion = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const sigOf = () => location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).slice(0, 2).join('/');
let mode = 'first', pending = 0, lastSig = null;

function stagger(){ let i = 0; $main.querySelectorAll('.page-head, .page-body, .section').forEach(el => el.style.setProperty('--i', i++)); }
function renderIn(){
  render();
  $main.classList.remove('leaving');
  stagger();
  $main.classList.add('entering');
  pending = setTimeout(() => $main.classList.remove('entering'), 1400);
}
function go(){
  const sig = sigOf(), same = sig === lastSig, m = mode;
  lastSig = sig; mode = 'normal'; clearTimeout(pending);
  if (m === 'first' || same || reduceMotion()) { $main.classList.remove('leaving', 'entering'); render(); return; }
  if (m === 'portal') { renderIn(); return; }
  $main.classList.add('leaving');
  pending = setTimeout(renderIn, 170);
}

/* ---- The door opens: light fills the screen from the door, then the world fades in ---- */
let opening = false;
function enterDoor(a){
  opening = true;
  const href = a.getAttribute('href'), r = a.getBoundingClientRect(), vw = window.innerWidth, vh = window.innerHeight, rad = r.width / 2;
  const from = `inset(${r.top}px ${vw - r.right}px ${vh - r.bottom}px ${r.left}px round ${rad}px ${rad}px 6px 6px)`;
  const to = 'inset(0px 0px 0px 0px round 0px 0px 0px 0px)';
  const ov = document.createElement('div');
  ov.className = 'portal';
  ov.setAttribute('style', a.getAttribute('style') || '');
  ov.setAttribute('aria-hidden', 'true');
  ov.style.clipPath = from;
  ov.style.opacity = '0';
  document.body.appendChild(ov);
  a.classList.add('opening');
  const done = () => { ov.remove(); a.classList.remove('opening'); opening = false; };
  ov.animate([
    { clipPath: from, opacity: 0, easing: 'ease-out' },
    { clipPath: from, opacity: 1, offset: .22, easing: 'cubic-bezier(.65,0,.2,1)' },
    { clipPath: to,   opacity: 1 }
  ], { duration: 900, fill: 'forwards' }).finished.then(() => {
    mode = 'portal';
    if (location.hash === href) go(); else location.hash = href;
    setTimeout(() => {
      ov.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 700, easing: 'ease', fill: 'forwards' }).finished.then(done, done);
    }, 140);
  }, done);
}
document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a.door');
  if (!a || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || reduceMotion()) return;
  e.preventDefault();
  if (!opening) enterDoor(a);
});

window.addEventListener('hashchange', go);
go();
</script>
